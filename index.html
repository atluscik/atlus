<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a_tluscik</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

<style>
:root { --accent:#007bff; --danger:#ff4d4d; --bg:#000; --card:#111; --border:rgba(255,255,255,0.1); }
*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:-apple-system,system-ui,sans-serif;
background:radial-gradient(circle at center,#1a1a1a 0%,#000 100%);
color:#fff;padding:15px;
}

.main-wrapper{
display:flex;
justify-content:center;
align-items:center;
height:95vh;
}

.column{
width:500px;
background:var(--card);
border:1px solid var(--border);
border-radius:24px;
padding:20px;
display:flex;
flex-direction:column;
box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

h1{font-size:26px;text-align:center;margin-bottom:10px;}

.upload-info{
text-align:center;
font-size:13px;
color:#00ff88;
margin-bottom:8px;
font-weight:bold;
}

.uploader-wrapper{
display:flex;
justify-content:center;
margin-bottom:15px;
}

#fileList{
list-style:none;
overflow-y:auto;
flex-grow:1;
}

#fileList li{
background:#181818;
padding:10px 15px;
border-radius:14px;
margin-bottom:8px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid var(--border);
}

.btn-download{
background:var(--accent);
color:white;
text-decoration:none;
padding:7px 12px;
border-radius:8px;
font-weight:bold;
font-size:11px;
}

.btn-delete{
background:rgba(255,77,77,0.05);
border:1px solid rgba(255,77,77,0.3);
color:var(--danger);
cursor:pointer;
padding:7px;
border-radius:8px;
}
</style>
</head>
<body>

<div class="main-wrapper">
<div class="column">
<h1>😈 a_tluscik</h1>

<div class="upload-info">wrzuć swój plik na listę</div>

<div class="uploader-wrapper">
<input type="hidden" role="uploadcare-uploader"
id="uploader"
data-public-key="6b42d984d10961c51a51" />
</div>

<ul id="fileList"></ul>
</div>
</div>

<script>
const PASS="ok123123";
const SUPABASE_URL='https://evmuryxvdfcuauisgxye.supabase.co';
const SUPABASE_KEY='sb_publishable_BdjYm6QVu8AX4rKWrEmSeA_EiLCbVNn';

const _supabase=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const widget=uploadcare.Widget('#uploader');
const listElement=document.getElementById('fileList');
let fileToDeleteId=null;

widget.onUploadComplete(async(info)=>{
await _supabase.from('pliki').insert([{name:info.name,url:info.originalUrl}]);
widget.value(null);
loadFiles();
});

async function loadFiles(){
const {data,error}=await _supabase.from('pliki').select('*').order('created_at',{ascending:false});
if(!error){
listElement.innerHTML=data.length?'':'<li style="color:#444;border:none;justify-content:center;">Brak nowych plików</li>';
data.forEach(file=>{
const li=document.createElement('li');
li.innerHTML=`
<span style="font-size:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
${file.name}
</span>
<div style="display:flex;gap:8px;">
<a href="${file.url}" class="btn-download" target="_blank">Pobierz</a>
</div>`;
listElement.appendChild(li);
});
}
}

loadFiles();
</script>
</body>
</html>
